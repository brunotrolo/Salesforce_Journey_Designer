<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Salesforce Journey Factory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4C8C"/>
      <stop offset="0.55" stop-color="#032D60"/>
      <stop offset="1" stop-color="#00132E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A1E0"/>
      <stop offset="1" stop-color="#22E3C6"/>
    </linearGradient>
  </defs>

  <rect width="960" height="260" rx="24" fill="url(#bg)"/>

  <!-- journey glyph: three waypoints on a path, ending in a pin. Sits on the left, mirrors the loop icon's role/size -->
  <g transform="translate(60 68)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <path d="M8 108 C 40 108, 40 60, 76 60 S 112 12, 148 12" stroke-dasharray="1 20"/>
    <circle cx="8" cy="108" r="9" fill="url(#accent)" stroke="none"/>
    <circle cx="76" cy="60" r="9" fill="url(#accent)" stroke="none"/>
    <path d="M148 -6 c16 0 28 12 28 27 0 20-28 47-28 47s-28-27-28-47c0-15 12-27 28-27z" fill="url(#accent)" stroke="none"/>
    <circle cx="148" cy="21" r="10" fill="#032D60" stroke="none"/>
  </g>

  <!-- title + tagline -->
  <text x="248" y="112" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Salesforce Journey Factory</text>
  <text x="250" y="150" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#BCD5F0">Da spec ao build, jornada por jornada &#8212; com governan&#231;a embutida.</text>

  <!-- pills -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="250" y="176" width="118" height="30" rx="15" fill="#04203F" stroke="#22E3C6" stroke-opacity="0.55"/>
    <text x="309" y="196" fill="#22E3C6" text-anchor="middle">6 agentes</text>

    <rect x="380" y="176" width="234" height="30" rx="15" fill="#04203F" stroke="#00A1E0" stroke-opacity="0.55"/>
    <text x="497" y="196" fill="#7FD3F2" text-anchor="middle">Spec-Driven Development</text>

    <rect x="626" y="176" width="196" height="30" rx="15" fill="#04203F" stroke="#8AA9D6" stroke-opacity="0.45"/>
    <text x="724" y="196" fill="#BCD5F0" text-anchor="middle">3 port&#245;es humanos</text>
  </g>
</svg>
